<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF" />
  <title>Pixel Composer v4 🎨🎶</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #111;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }
    .btn {
      background: #444;
      color: white;
      padding: 6px 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover {
      background: #666;
    }
    .btn.active {
      background: #00cc88;
    }
    #clearBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 6px 10px;
      font-size: 14px;
      background: #444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #clearBtn:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="toolbar">
    <button class="btn active" data-id="1">🎹 Lead</button>
    <button class="btn" data-id="2">🥁 Perc</button>
    <button class="btn" data-id="3">🎸 Pluck</button>
    <button class="btn" data-id="4">🌫 Pad</button>
    <button class="btn" data-id="5">🎛 Bass</button>
  </div>
  <button id="clearBtn">🧼 Clear</button>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let drawing = false, lastX = 0, lastY = 0;
    let currentInstrument = 1;

    const instrumentColors = {
      1: '#ff6699', // lead
      2: '#ffcc00', // perc
      3: '#66ccff', // pluck
      4: '#cc99ff', // pad
      5: '#00ffaa'  // bass
    };

    function playSound(dx, dy, instrumentId) {
      const freq = 200 + Math.sqrt(dx * dx + dy * dy) * 5;
      const gain = audioCtx.createGain();

      switch (instrumentId) {
        case 1: { // 🎹 Lead (with vibrato)
          const osc = audioCtx.createOscillator();
          const lfo = audioCtx.createOscillator();
          const lfoGain = audioCtx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.value = freq;

          lfo.frequency.value = 5;
          lfoGain.gain.value = 15;
          lfo.connect(lfoGain).connect(osc.frequency);

          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);

          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          lfo.start();
          osc.stop(audioCtx.currentTime + 0.7);
          lfo.stop(audioCtx.currentTime + 0.7);
          break;
        }
        case 2: { // 🥁 Percussion (noise burst)
          const bufferSize = 256;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
          noise.connect(gain).connect(audioCtx.destination);
          noise.start();
          noise.stop(audioCtx.currentTime + 0.2);
          break;
        }
        case 3: { // 🎸 Pluck
          const osc = audioCtx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
          break;
        }
        case 4: { // 🌫 Pad
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = freq * 0.5;
          gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 1.2);
          break;
        }
        case 5: { // 🎛 Bass (square + filter)
          const osc = audioCtx.createOscillator();
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 400;

          osc.type = 'square';
          osc.frequency.value = freq * 0.5;
          osc.detune.value = -30;

          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

          osc.connect(filter).connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
          break;
        }
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      drawing = true;
      lastX = e.offsetX;
      lastY = e.offsetY;
    });

    canvas.addEventListener('mouseup', () => drawing = false);

    canvas.addEventListener('mousemove', (e) => {
      if (!drawing) return;
      const x = e.offsetX, y = e.offsetY;
      const dx = x - lastX, dy = y - lastY;
      const color = instrumentColors[currentInstrument] || '#fff';

      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);
      ctx.stroke();

      playSound(dx, dy, currentInstrument);
      lastX = x;
      lastY = y;
    });

    // Fading trail effect
    setInterval(() => {
      ctx.fillStyle = 'rgba(17,17,17,0.05)';
      ctx.fillRect(0, 0, width, height);
    }, 30);

    // Clear canvas
    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, width, height);
    });

    // Instrument switching
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentInstrument = parseInt(btn.getAttribute('data-id'));
      });
    });
  </script>
</body>
</html>
